services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: valiant-ai-engine:latest
    container_name: valiant-ai-engine
    ports:
      - "${API_PORT:-7861}:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
